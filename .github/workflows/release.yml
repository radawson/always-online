name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from build.gradle.kts
        id: get_version
        run: |
          VERSION=$(grep 'extra\[\"plVersion\"\] = ' build.gradle.kts | head -1 | sed 's/.*= "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Build
        run: ./gradlew build

      - name: Verify output and rename with version
        run: |
          ls -la output/
          if [ ! -f "output/always-online-latest.jar" ]; then
            echo "Error: always-online-latest.jar not found"
            exit 1
          fi

          cp "output/always-online-latest.jar" "output/always-online-${{ steps.get_version.outputs.version }}.jar"

          echo "Output:"
          ls -la output/always-online-*.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Always Online v${{ steps.get_version.outputs.version }}
          body: |
            ## Always Online v${{ steps.get_version.outputs.version }}

            ### Files:
            - `always-online-${{ steps.get_version.outputs.version }}.jar` - Plugin for Paper 1.21 and Velocity proxy

            ### Installation:
            1. Download the jar file
            2. Place it in your server's plugins directory (Paper) or proxy plugins directory (Velocity)
            3. Restart your server
          files: |
            output/always-online-${{ steps.get_version.outputs.version }}.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
