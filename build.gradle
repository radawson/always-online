plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

ext {
    plVersion = '7.0.0'
}

// Single platform: Paper (and Velocity in same jar). Root build = build the plugin.
tasks.named('build') {
    dependsOn ':implementation:build'
}

allprojects {
    group = 'me.dablakbandit'
    version = plVersion

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
        maven { url = 'https://ci.lucko.me/plugin/repository/everything/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://jitpack.io' }
        maven { url "https://repo.spongepowered.org/repository/maven-public" }
        maven { url = 'https://libraries.minecraft.net/' }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    compileJava {
        options.encoding = 'UTF-8'
    }

    ext {
        bukkitVersion = '1.14-R0.1-SNAPSHOT'
        aoVersion = plVersion
    }
}